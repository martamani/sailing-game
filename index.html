<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A Small Sailing Game</title>
    <style>
        * { box-sizing: border-box; user-select: none; }
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background-color: #0d1b2a; overflow: hidden;
            font-family: 'Courier New', Courier, monospace; font-weight: bold; color: #fff;
        }
        #game-container {
            position: relative; width: 100vw; height: 100vh;
            display: flex; justify-content: center; align-items: center;
        }
        canvas { background-color: #3a86c8; box-shadow: 0 0 20px rgba(0,0,0,0.6); }
        .shake { animation: shakeAnim 0.15s ease-in-out; }
        @keyframes shakeAnim {
            0% { transform: translate(0, 0); }
            20% { transform: translate(-4px, 3px); }
            40% { transform: translate(4px, -3px); }
            60% { transform: translate(-3px, -2px); }
            80% { transform: translate(3px, 2px); }
            100% { transform: translate(0, 0); }
        }
        .box {
            position: absolute; top: 5%; left: 10%; width: 80%; max-height: 85%;
            background: #1b263b; border: 4px solid #fff; padding: 25px;
            z-index: 10; display: block; line-height: 1.6; font-size: 13px; overflow-y: auto;
        }
        .btn {
            background: #e63946; color: #fff; padding: 12px 24px; cursor: pointer;
            border: 2px solid #fff; display: inline-block; margin: 5px;
            text-transform: uppercase; font-weight: bold; text-decoration: none; box-shadow: 3px 3px 0px #000;
        }
        .btn:hover { background: #a8222e; transform: translate(1px, 1px); box-shadow: 2px 2px 0px #000; }
        .links-container { margin-top: 20px; display: flex; gap: 15px; justify-content: center; flex-wrap: wrap; }
        #boat {
            position: absolute; width: 18px; height: 28px; background: #fff;
            border-radius: 50% 50% 0 0; z-index: 6; border: 2px solid #1d3557; transition: transform 0.1s ease-out;
        }
        #boat::after {
            content: ''; position: absolute; top: 6px; left: 6px; width: 0; height: 0;
            border-left: 6px solid #e63946; border-top: 4px solid transparent; border-bottom: 4px solid transparent;
        }
        #portal {
            position: absolute; width: 80px; height: 80px; border: 3px dashed #e63946;
            border-radius: 50%; text-align: center; font-size: 10px; font-weight: bold;
            line-height: 74px; color: #fff; z-index: 5; background: rgba(230, 57, 70, 0.1);
        }
        .rock { position: absolute; width: 50px; height: 50px; background: #4a5759; border-radius: 50%; border: 3px solid #253237; z-index: 4; }
        .wave { position: absolute; height: 3px; background: rgba(255, 255, 255, 0.2); border-radius: 2px; z-index: 1; }
        .firework { position: absolute; width: 4px; height: 4px; border-radius: 50%; z-index: 2; }
        .fw-red { background: #e63946; box-shadow: 0 0 6px #e63946; }
        .fw-cyan { background: #a8dadc; box-shadow: 0 0 6px #a8dadc; }
        .fw-yellow { background: #ffb703; box-shadow: 0 0 6px #ffb703; }
    </style>
</head>
<body>

<div id="game-container">
    <canvas id="gameCanvas"></canvas>
    <div id="controls-hint">Use ARROW KEYS or WASD to sail</div>
    <div id="ui-overlay" class="overlay">
        <div class="box" id="box">
            <p id="txt">A SMALL SAILING GAME<br><br>Three short stops. No score, no winning. A few things the sea taught me.</p>
            <div id="btn" class="btn" onclick="go()">CAST OFF</div>
        </div>
    </div>
</div>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const uiOverlay = document.getElementById('ui-overlay');
    const storyContent = document.getElementById('txt');
    const actionButton = document.getElementById('btn');
    const m = document.getElementById('game-container');

    const WIDTH = 800, HEIGHT = 600;
    canvas.width = WIDTH; canvas.height = HEIGHT;
    let keys = {}, waves = [], fireworks = [];

    const rockPositions = [
        {x: 350, y: 220}, {x: 520, y: 380}, {x: 200, y: 100}, {x: 600, y: 500}, {x: 120, y: 280}
    ];

    const txts = [
`MASTERY

A dinghy. Strange gusts coming from nowhere. You capsize — flip the boat, climb back in with the grace of an elephant. The wind keeps shoving you at the rocks.

You look up. The fancy yachts behind the cargo ship aren't moving either. So it's not just a dinghy thing... The wind's running in corridors between the tall buildings — and poor you, you're in one.

You can't out-sail it. So you surrender: capsize again, on purpose this time, and wait for the zodiac. Warm water, no damage. The right call — not exactly epic.

Read the wind before you fight it.`,

`CONNECTION

A new crew. Tough guys, pirates basically. Your job is the spinnaker: a flying sail, all precision, quick to drop in the water — and you're not flying it well.

Then the light wind does the trick — the crew starts going green, one by one. Even the so-called captain. All defeated, heads over the side.

You're queasy too, but holding. So you call it: you can't fly the spinnaker, but you can make sandwiches. A steadier hand takes the sail.

Best sandwiches ever made. An hour later everyone's fed and cracking jokes.

The least glamorous job on the boat was the one that helped. Usually is.`,

`AUTONOMY

Back on land. This is your element.

You'd been feeding language data into a research project, and it kept underperforming. You looked closer — the datasets were mixing up language variants, quietly muddying everything. Nobody had noticed.

Would a cleaner dataset of your own do better? So you built one — taught yourself the tools as you went (Python, an LLM roped in as a 'judge', a fair bit of begging whatever AI for help).

Half of what you learned was where the judge itself fell apart — the thing meant to catch mistakes turned out to be the shakiest in the room. Fair enough.

Flat calm, not exactly your cup of tea.

That's the part I value: finding the root cause, maybe learning something along the way.`,

`WHY NEX

You're back on shore. Salt on your skin, the day behind you. None of it happened on a screen.

I've worked in games, and I've seen how good they are at holding attention — how much craft goes into keeping people playing.

Nex points that craft the other way: getting kids and adults off the couch, moving, playing together — with safety and healthy play at the core. That's the part I want to work on now.

That's why I'm here.

<div class="links-container">
    <a href="mailto:marta.mani@gmail.com" target="_top" class="btn">Say Hello</a>
</div>`,

`<div style="text-align: center; padding: 20px;">
    <h1 id="end-title" style="font-family: monospace; font-size: 32px; color: #fff; margin-bottom: 20px; transition: transform 0.1s linear;">THE END</h1>
    <p style="font-size: 16px; color: #a8dadc; margin-bottom: 10px;">Thanks for playing!</p>
    <p style="font-size: 12px; opacity: 0.8;">Fair winds to you!</p>
</div>`
    ];

    const lbls = ["MASTERY", "CONNECTION", "AUTONOMY", "WHY NEX", "THE END", "RESET"];
    const positions = [{x:650,y:150},{x:400,y:100},{x:650,y:400},{x:300,y:300},{x:150,y:200}];
    let st = 0;

    for (let i = 0; i < 25; i++) {
        waves.push({
            x: Math.random() * WIDTH, y: Math.random() * HEIGHT,
            length: 15 + Math.random() * 20, s: 0.5 + Math.random() * 0.8
        });
    }

    const boat = { x: 150, y: 450, radius: 10, drawAngle: 0 };
    const portal = { x: 650, y: 150, radius: 40, pulse: 0, label: "MASTERY" };
    let animTimer = 0;

    window.addEventListener('keydown', e => { keys[e.code] = true; });
    window.addEventListener('keyup', e => { keys[e.code] = false; });

    function triggerScreenshake() {
        m.classList.remove('shake');
        void m.offsetWidth;
        m.classList.add('shake');
    }

    function launchFirework() {
        let colors = ['#e63946', '#a8dadc', '#ffb703'];
        let c = colors[Math.floor(Math.random() * colors.length)];
        let fX = 100 + Math.random() * 600, fY = 100 + Math.random() * 300;
        for (let i = 0; i < 15; i++) {
            let angle = Math.random() * Math.PI * 2, speed = 1 + Math.random() * 3;
            fireworks.push({ x: fX, y: fY, vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed, life: 40 + Math.random() * 30, color: c });
        }
    }

    function go() {
        document.getElementById('box').style.display = 'none';
        fireworks = [];
        st++;
        if (st > 5) { st = 1; }
        boat.x = 150; boat.y = 450; boat.drawAngle = 0;
        let currentPos = positions[st - 1];
        if (currentPos) { portal.x = currentPos.x; portal.y = currentPos.y; portal.label = lbls[st - 1]; }
    }

    setInterval(() => {
        waves.forEach(w => { w.x -= w.s; if (w.x < -40) { w.x = WIDTH + 40; } });

        if (document.getElementById('box').style.display === 'block' && st === 5) {
            animTimer += 0.05;
            let titleEl = document.getElementById('end-title');
            if (titleEl) titleEl.style.transform = `translateY(${Math.sin(animTimer) * 8}px)`;
            if (Math.random() < 0.04) launchFirework();
        }

        fireworks.forEach((f, idx) => {
            f.x += f.vx; f.y += f.vy; f.vy += 0.04; f.life--;
            if (f.life <= 0) fireworks.splice(idx, 1);
        });

        if (document.getElementById('box').style.display === 'block') return;

        let moveX = 0, moveY = 0;
        if (keys['ArrowUp'] || keys['KeyW']) moveY = -4;
        if (keys['ArrowDown'] || keys['KeyS']) moveY = 4;
        if (keys['ArrowLeft'] || keys['KeyA']) moveX = -4;
        if (keys['ArrowRight'] || keys['KeyD']) moveX = 4;

        if (moveX !== 0 || moveY !== 0) {
